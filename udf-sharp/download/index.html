<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>UDF# en son sürümü indiriliyor</title>
</head>
<body>
  <main>
    <h1>UDF# en son sürümü</h1>
    <p id="status" role="status" aria-live="polite">En son sürüm bulunuyor. İndirme kısa süre içinde başlayacak.</p>
    <p id="fallback" hidden>Otomatik indirme başlamazsa <a id="release-link" href="https://github.com/ferhatbkr/UDF-Sharp-Releases/releases/latest">GitHub'daki en son sürüm sayfasını açın</a>.</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById("status");
      const fallback = document.getElementById("fallback");
      try {
        const response = await fetch("https://api.github.com/repos/ferhatbkr/UDF-Sharp-Releases/releases/latest", {
          headers: { "Accept": "application/vnd.github+json" }
        });
        if (!response.ok) throw new Error("GitHub API yanıtı başarısız.");
        const release = await response.json();
        const assets = Array.isArray(release.assets) ? release.assets : [];
        const installer = assets.find(asset =>
          /^UdfSharp-Setup.*\.exe$/i.test(asset.name) && asset.browser_download_url
        );
        if (!installer) throw new Error("Kurulum dosyası bulunamadı.");
        status.textContent = "UDF# " + (release.tag_name || "") + " indiriliyor.";
        window.location.replace(installer.browser_download_url);
      } catch (error) {
        status.textContent = "Otomatik indirme bağlantısı şu anda oluşturulamadı.";
        fallback.hidden = false;
      }
    })();
  </script>
</body>
</html>
